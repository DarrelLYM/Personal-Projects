# Hourly reminders for Grace's Calorie Tracker.
# Free on public repos. Needs the repository secret FIREBASE_SERVICE_ACCOUNT (see calorie-tracker/README.md).
name: Calorie tracker reminders

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub may start it later when busy)
  workflow_dispatch:       # "Run workflow" button for testing

permissions:
  contents: read
  actions: write           # only used to keep this schedule switched on

concurrency:
  group: calorie-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_URL: https://darrellym.github.io/Personal-Projects/calorie-tracker/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: calorie-tracker/scripts/notify
        run: npm ci --no-audit --no-fund
      - name: Check reminder rules
        working-directory: calorie-tracker/scripts/notify
        run: node --test reminders.test.mjs
      - name: Send due reminders
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        working-directory: calorie-tracker/scripts/notify
        run: node notify.mjs
      - name: Keep the hourly schedule switched on
        # GitHub pauses scheduled workflows after 60 days without repository activity.
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notify.yml/enable"
